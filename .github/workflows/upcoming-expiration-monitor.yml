name: Brand Search Upcoming Expiration Monitor

on:
  workflow_dispatch:
  schedule:
    # 매월 25일 오전 8시 KST = 24일 23시 UTC
    - cron: "0 23 24 * *"
    # 매월 1일 오전 8시 KST 후보. 아래 일정 확인 단계에서 실제 KST 1일만 실행한다.
    - cron: "0 23 28-31 * *"

permissions:
  contents: read

concurrency:
  group: brand-search-upcoming-expiration-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPCOMING_WEBHOOK_URL: ${{ secrets.UPCOMING_WEBHOOK_URL }}
      UPCOMING_WEBHOOK_TOKEN: ${{ secrets.UPCOMING_WEBHOOK_TOKEN }}
      UPCOMING_DAYS: "7"
      UPCOMING_REPORT_PATH: upcoming-report.json
    steps:
      - name: Check scheduled date
        id: schedule_date
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=Asia/Seoul date +%d)" == "01" || "$(TZ=Asia/Seoul date +%d)" == "25" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.schedule_date.outputs.should_run == 'true'
      - uses: actions/setup-node@v4
        if: steps.schedule_date.outputs.should_run == 'true'
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        if: steps.schedule_date.outputs.should_run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.schedule_date.outputs.should_run == 'true'
      - run: npm run monitor:upcoming
        if: steps.schedule_date.outputs.should_run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.schedule_date.outputs.should_run == 'true'
        with:
          name: upcoming-expiration-${{ github.run_id }}
          path: upcoming-report.json
          if-no-files-found: ignore
          retention-days: 30
